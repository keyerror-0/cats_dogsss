version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"  # Web UI
    volumes:
      - minio-data:/data
    networks:
      - app-network

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - app-network

  kafka1:
    image: bitnami/kafka:3.6
    container_name: kafka1
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
    ports:
      - "9092:9092"
    networks:
      - app-network

  kafka2:
    image: bitnami/kafka:3.6
    container_name: kafka2
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9093
    ports:
      - "9093:9093"
    networks:
      - app-network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: bot
    depends_on:
      - minio
      - kafka1
      - kafka2
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093
    networks:
      - app-network
    restart: unless-stopped

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    container_name: inference
    depends_on:
      - minio
      - kafka1
      - kafka2
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093
    networks:
      - app-network
    restart: unless-stopped
    # Для GPU: раскомментируйте следующее
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    container_name: notification
    depends_on:
      - minio
      - kafka1
      - kafka2
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9093
    networks:
      - app-network
    restart: unless-stopped

volumes:
  minio-data:

networks:
  app-network:
    driver: bridge