apiVersion: apps/v1
kind: Deployment
metadata:
  name: retraining-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retraining-service
  template:
    metadata:
      labels:
        app: retraining-service
    spec:
      containers:
      - name: retraining-service
        image: perforator123/23934_retraining_service:latest
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secret
              key: token
        - name: MINIO_ENDPOINT
          value: "minio-service:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: access_key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: secret_key
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"


---
apiVersion: v1
kind: Service
metadata:
  name: retraining-service
spec:
  selector:
    app: retraining-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80